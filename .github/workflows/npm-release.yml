name: npm Release (create-lagrange)

# Publishes the `create-lagrange` scaffolding package to npm on version tags
# (the prebuilt `lagrange` binary archive is uploaded to the GitHub Release by
# release.yml; create-lagrange fetches it at install time).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish create-lagrange to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
      - name: Align version with the tag
        run: |
          cd create-lagrange
          node -e "const p=require('./package.json'); p.version=process.env.GITHUB_REF_NAME.replace(/^v/,''); require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n')"
          git diff --stat
      - name: Publish
        run: npm publish --access public --provenance
        working-directory: create-lagrange
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
