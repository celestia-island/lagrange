name: Release binaries
on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

# Builds the `lagrange` binary for three targets and uploads tar.gz archives
# to the GitHub Release. The archives are fetched at install time by
# `create-lagrange` (npm) and are cargo-binstall compatible (the
# [package.metadata.binstall] block in Cargo.toml declares the URL pattern).

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure the release tag is on master
        if: github.event_name == 'push' && !github.event.deleted
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lagrange-${{ github.ref_name }}-${{ matrix.target }}.tar.gz lagrange
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../lagrange-${{ github.ref_name }}-${{ matrix.target }}.zip lagrange.exe
          cd ../../..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lagrange-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            lagrange-${{ github.ref_name }}-${{ matrix.target }}.zip

  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: celestia-island/celestia-devtools/.github/workflows/release-notes.yml@master
