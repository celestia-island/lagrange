allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sass-embedded: true
# Explicit base is REQUIRED: pnpm 11's release-age gate ignores the
# exclude list below unless minimumReleaseAge itself is set (the family
# trap, _ledger/toolchain-pnpm.md).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Exact pins, not chest's bare-name shape: this repo commits no
  # lockfile and CI installs with --no-frozen-lockfile, so a bare-name
  # exemption would let every deploy re-resolve to the newest hikari in
  # ^0.55.459 with no commit to point at (review round 10 of #120
  # measured a same-day 0.55.463 resolving). The repo-level deviation is
  # recorded in _ledger/toolchain-pnpm.md; same-day pickups here edit the
  # pin (the ledger's surgical recipe).
  # Same-day pickup (2026-11-25): brand-as-trigger, hikari#1544.
  # Same-day pickup (2026-11-25): solar system-mode boot asset, hikari#1550.
  # Same-day pickup (2026-11-25): custom-theme memo replay, hikari#1552.
  # Same-day pickup (2026-11-25): Rust-derived theme vars, hikari#1557/#1560.
  - '@celestia-island/hikari@0.55.488'
  # Same-day pickup (2026-11-25): flipped menu cascade anchors at the trigger's
  # measured edge (the language popup's drift) + theme-name i18n, hikari#1562.
  - '@celestia-island/hikari@0.55.491'
  # Same-day pickup (2026-11-26): dialogs stay vertically centered through
  # height morphs (the 11-23 top-edge pin retired, hikari#1567) — the docs
  # theme window's DPI fold and sun-clock globe sit on that surface.
  - '@celestia-island/hikari@0.55.493'
  # Same-day pickup (2026-11-26): the sun-clock lookup's in-flight state reads
  # as a compact centered circle (both upstream renderers) and the
  # detected-value readout splits label-left / value-right, hikari#1571.
  - '@celestia-island/hikari@0.55.495'
  # Same-day pickup (2026-11-26): the docs shell's mermaid cards get a real
  # viewport (the board no longer fits against a collapsed 2px flex item) and
  # subgraph clusters render as frames, hikari#1576/#1577.
  - '@celestia-island/hikari@0.55.497'
  # Same-day pickup (2026-11-24): phone nav drawer, hikari#1535.
  - '@celestia-island/hikari@0.55.479'
  - '@celestia-island/tairitsu-host-client@0.1.0'
  # Same-day pickup (2026-11-27): mobile drawer body loses its default
  # padding so the nav panel + its overlay rail reach the drawer edge
  # (hikari#1590), and graph node labels may use the width the layout
  # sized for them (hikari#1591).
  - '@celestia-island/hikari@0.55.500'
  # Same-day pickup (2026-11-27): board arrows enter their targets head-on,
  # cyclic flowcharts rank like mermaid.js, the zoom bar docks UNDER the
  # board, fitted diagrams are draggable, and sequence junctions count as
  # content (hikari#1593).
  - '@celestia-island/hikari@0.55.501'
  # Same-day pickup (2026-11-28): HkDirectionalSwap (the card's pane switch
  # slides with the reading direction instead of hard-cutting) plus the Rust
  # code-highlight header slots, hikari#1598/#1599.
  - '@celestia-island/hikari@0.55.503'
  # Parser-fidelity pickup (2026-11-28): state pseudostates stay separate
  # circles, `participant A as Alice` resolves, and link head glyphs
  # (`--o`/`--x`/`<-->`) are syntax rather than node ids — hikari#1602/#1604.
  - '@celestia-island/hikari@0.55.505'
  # Structure pickup (2026-11-28): class multiplicities stop inventing class
  # names, composite states become clusters, and `--o`/`--x`/`<-->` heads are
  # drawn — hikari#1606/#1607.
  - '@celestia-island/hikari@0.55.506'
  # Audit pickup (2026-11-28): the outline shapes stop squeezing their labels
  # and state notes no longer fail the diagram — hikari#1610.
  - '@celestia-island/hikari@0.55.507'
  # Parser-semantics pickup (2026-11-28): implied classes, out-of-block
  # members, and activation markers stop becoming lane names — hikari#1614.
  - '@celestia-island/hikari@0.55.508'
