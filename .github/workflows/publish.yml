name: Publish crates.io
on:
  push:
    tags: [v*]
  # Re-run path for a half-failed publish (a tag push that died between the
  # workspace crates and the library). Version comes from the manifest, not
  # the ref, so a dispatch on master publishes exactly what master declares.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the release tag is on master
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"

      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `lagrange-library` depends on the workspace crate `lagrange-content`,
      # and cargo refuses to upload a package whose registry dependency does
      # not exist yet ("no matching package named `lagrange-content` found" —
      # the 2026-11-25 v0.3.0 publish failure). Publish the dependency chain
      # bottom-up, skipping anything already on crates.io, and wait for the
      # index to serve each crate before the next one resolves against it.
      - name: Publish the crate chain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          version_of() {
            python3 - "$1" <<'PY'
          import json, subprocess, sys
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          print(next(p["version"] for p in meta["packages"] if p["name"] == sys.argv[1]))
          PY
          }
          # crates.io rejects curl's default user agent (403), and a 403/000
          # must never be mistaken for "absent" — that would re-publish a
          # version that already exists.
          state() {
            local code
            code=$(curl -s -A "celestia-island-release (lagrange publish workflow)" \
              -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/$1/$2" || echo 000)
            case "$code" in
              200) echo published ;;
              404) echo absent ;;
              *) echo "error-$code" ;;
            esac
          }
          publish() {
            local crate="$1" version
            version=$(version_of "$crate")
            case "$(state "$crate" "$version")" in
              published)
                echo "::warning::$crate $version is already on crates.io — skipping"
                return 0
                ;;
              absent) ;;
              *)
                echo "::error::cannot determine whether $crate $version is published: $(state "$crate" "$version")"
                return 1
                ;;
            esac
            cargo publish -p "$crate" --locked
            for _ in $(seq 1 30); do
              [ "$(state "$crate" "$version")" = "published" ] && return 0
              sleep 10
            done
            echo "::error::$crate $version did not appear on crates.io after publishing"
            return 1
          }
          publish lagrange-content
          publish lagrange-library
