name: npm Release (@celestia-island/lagrange)

# Publishes the `@celestia-island/lagrange` scaffolder to npm using OIDC Trusted
# Publishing (id-token: write + --provenance), so the registry can verify the
# provenance chain back to this repository without a stored token.
#
# The package has no dependencies of its own: `npm install` only runs the
# postinstall binary fetcher (non-fatal if the network is unavailable), and
# the downloaded binary is excluded from the tarball via the `files`
# whitelist.
#
# Tag convention: crates and binary archives release on plain `v*` tags
# (publish.yml, release.yml); the npm package releases on `npm-v*` tags so
# the two version streams never collide.

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1), without leading v; falls back to the tag name"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @celestia-island/lagrange to npm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the release tag is on master
        if: github.event_name == 'push' && !github.event.deleted
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#npm-v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing @celestia-island/lagrange@$v"

      - name: Install dependencies
        run: |
          cd create-lagrange
          npm install

      - name: Bump version
        run: |
          cd create-lagrange
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: |
          cd create-lagrange
          npm publish --access public --provenance
