name: Checks

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 5f280203dd6794b9e631978c5984d5a4d4f801b1

  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 5f280203dd6794b9e631978c5984d5a4d4f801b1
